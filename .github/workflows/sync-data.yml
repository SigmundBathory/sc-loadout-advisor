name: Daily Star Citizen data sync

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions uses UTC. This runs every day at 00:00 UTC.
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: star-citizen-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Synchronize and validate data
        run: npx --yes tsx scripts/full-sync.ts --force

      - name: Commit database when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sc-loadout.db

          if git diff --cached --quiet; then
            echo "No verified database changes detected"
            exit 0
          fi

          git commit -m "sync: update verified Star Citizen data"
          git push origin main
