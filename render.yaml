services:
  - type: web
    name: sc-loadout-advisor
    runtime: node
    plan: free
    buildCommand: >
      npm install &&
      npm rebuild better-sqlite3 &&
      npm run build &&
      (cp -r data .next/standalone/data 2>/dev/null || true) &&
      (mkdir -p .next/standalone/data && cp -f data/sc-loadout.db .next/standalone/data/ 2>/dev/null || true)
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /opt/render/project/src/.next/standalone/data/sc-loadout.db
